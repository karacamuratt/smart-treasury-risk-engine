services:
  postgres:
    image: postgres:16-alpine
    container_name: str_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: str_db
    ports:
      - "5432:5432"
    volumes:
      - str_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: str_redis
    ports:
      - "6379:6379"

volumes:
  str_pgdata:
